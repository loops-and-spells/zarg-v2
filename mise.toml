monorepo_root = true

[monorepo]
config_roots = ["packages/*"]

[tools]
bun = "1.4.2"

[tasks.verify]
description = "Typecheck and test every package. Exit code is the verdict."
depends = ["//...:typecheck", "//...:test", "audit"]

[tasks.audit]
description = "The one CI check (zarg audit): graph structure and lints, completeness, intent coverage, code tags, proof by e2e evidence, evidence integrity"
depends = ["//...:build"]
run = "mise x -- bun packages/cli/src/main.ts audit --summary"

[tasks.zarg]
description = "Run this repo's zarg CLI: mise run zarg -- agenda (builds every plugin in the monorepo first)"
depends = ["//...:build"]
run = "mise x -- bun packages/cli/src/main.ts"


[tasks."smoke:chat"]
description = "Live chat smoke test: one real driver item through core and the client (needs the configured driver model)"
run = "mise x -- bun packages/cli/smoke/chat.ts"

[tasks."smoke:implement"]
description = "Live implement smoke test: one real card through plan and implement, in a scratch clone (needs the configured plan and implement models)"
run = "mise x -- bun packages/cli/smoke/implement.ts"

[tasks.smoke]
description = "Live smoke test: one real research RLM on this repo (needs the configured model providers)"
run = "mise x -- bun packages/rlm/smoke/smoke.ts"

[tasks."calibrate:rehearse"]
description = "Live rehearse calibration: the labelled steps against the decision model (needs zarg-router; ask first)"
run = "mise x -- bun packages/agent-rehearse/scripts/calibrate.ts"

[tasks.e2e]
description = "End-to-end proof, fast tier: journeys with no model turns, each on a fresh project (mise run e2e -- J-0005 for one)"
depends = ["build:plugins"]
run = "mise x -- bun packages/e2e/src/run.ts"

[tasks."e2e:full"]
description = "End-to-end proof, every journey, on the live zarg-router models (deepseek-v4.1-flash-exl3, jevk5; never started or loaded by the suite)"
depends = ["build:plugins"]
run = "mise x -- bun packages/e2e/src/run.ts --full"

[tasks."setup:hooks"]
description = "Use the repo's git hooks (.githooks): the fast e2e tier before every push"
run = "git config core.hooksPath .githooks"

[tasks."build:plugins"]
description = "Build zarg's own plugins (dist/) and record their first-party hashes"
run = "mise x -- bun packages/plugin/scripts/build-plugins.ts"
